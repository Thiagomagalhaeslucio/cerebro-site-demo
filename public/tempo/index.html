<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cérebro</title>
  <script src="/static/tema.js"></script>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="/static/formulario.css">
  <link rel="stylesheet" href="/static/escrita.css">
  <link rel="stylesheet" href="/static/tempo.css">
</head>
<body>
  <main class="pagina">
    <header class="cabecalho">
      <div class="linha-titulo">
        <h1>Tempo</h1>
        <span class="lido" id="meta">Lendo o vault.</span>
      </div>
    </header>

    <ul id="avisos" class="avisos"></ul>

    <div class="relogios">
      <section class="destaque" aria-labelledby="cron-t">
        <h2 id="cron-t" class="titulo-destaque">Cronômetro</h2>
        <p class="digitos" id="cron-digitos" role="timer" aria-live="off">00:00</p>
        <div class="campo">
          <label for="cron-projeto">Projeto</label>
          <input id="cron-projeto" class="controle" type="text" list="projetos" maxlength="60" autocomplete="off">
          <datalist id="projetos"></datalist>
        </div>
        <div class="acoes">
          <button type="button" class="botao" id="cron-iniciar">Iniciar</button>
          <button type="button" class="botao" id="cron-zerar">Zerar</button>
          <button type="button" class="botao" id="cron-gravar">Gravar</button>
        </div>
        <p class="dica" id="cron-dica" role="status">Conta o tempo aqui; "Gravar" acrescenta a linha em 80-tempo/AAAA-MM.md e zera o cronômetro.</p>
      </section>

      <section class="destaque" aria-labelledby="pomo-t">
        <h2 id="pomo-t" class="titulo-destaque">Pomodoro</h2>
        <p class="fase" id="pomo-fase">Foco</p>
        <p class="digitos" id="pomo-digitos" role="timer" aria-live="off">25:00</p>
        <span class="progresso" id="pomo-barra-trilho" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Andamento da fase"><span id="pomo-barra"></span></span>
        <div class="acoes">
          <button type="button" class="botao" id="pomo-iniciar">Iniciar</button>
          <button type="button" class="botao" id="pomo-pular">Pular fase</button>
          <button type="button" class="botao" id="pomo-zerar">Zerar fase</button>
        </div>
        <p class="dica" id="pomo-info"></p>
        <p class="dica aviso-fase" id="pomo-aviso" role="status"></p>
      </section>
    </div>

    <section class="destaque" aria-labelledby="resumo-t">
      <h2 id="resumo-t" class="titulo-destaque">Resumo</h2>
      <dl id="resumo" class="resumo-tempo"></dl>
    </section>

    <details class="novo" id="manual">
      <summary>Registrar à mão</summary>
      <form id="manual-form" class="formulario" autocomplete="off">
        <div class="par">
          <div class="campo"><label for="m-projeto">Projeto</label><input id="m-projeto" class="controle" type="text" list="projetos" maxlength="60" required></div>
          <div class="campo"><label for="m-data">Data</label><input id="m-data" class="controle" type="date" required></div>
        </div>
        <div class="par">
          <div class="campo"><label for="m-min">Minutos</label><input id="m-min" class="controle" type="number" min="1" max="1440" step="1" required></div>
          <div class="campo"><label for="m-nota">Nota (opcional)</label><input id="m-nota" class="controle" type="text" maxlength="120"></div>
        </div>
        <button type="submit" class="botao">Registrar</button>
        <p class="dica" id="manual-msg" role="status"></p>
      </form>
    </details>

    <section class="secao" aria-labelledby="semana-t">
      <h2 id="semana-t">Esta semana</h2>
      <div id="semana"></div>
    </section>

    <section class="secao" aria-labelledby="mes-t">
      <h2 id="mes-t">Maiores projetos do mês</h2>
      <div id="mes"></div>
    </section>

    <section class="secao" aria-labelledby="recentes-t">
      <h2 id="recentes-t">Últimos registros</h2>
      <div id="recentes"></div>
    </section>
    <div id="dica"></div>
  </main>

  <script src="/static/shell.js"></script>
  <script src="/static/live.js"></script>
  <script src="/static/escrita.js"></script>
  <script src="/tempo/relogio.js"></script>
  <script src="/tempo/relogios.js"></script>
  <script src="/tempo/app.js"></script>
</body>
</html>
