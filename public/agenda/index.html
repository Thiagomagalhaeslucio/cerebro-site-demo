<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cérebro</title>
  <script src="/static/tema.js"></script>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="/static/semana.css">
  <link rel="stylesheet" href="/static/formulario.css">
  <link rel="stylesheet" href="/static/escrita.css">
</head>
<body>
  <main class="pagina">
    <header class="cabecalho">
      <div class="linha-titulo">
        <h1>Agenda</h1>
        <span class="lido" id="meta">Lendo o vault.</span>
      </div>
    </header>

    <ul id="avisos" class="avisos"></ul>

    <div class="ferramentas">
      <div class="grupo-botoes" role="tablist" aria-label="Visão">
        <button type="button" class="botao" role="tab" id="aba-lista" aria-controls="visao-lista" aria-selected="true">Próximos 14 dias</button>
        <button type="button" class="botao" role="tab" id="aba-mes" aria-controls="visao-mes" aria-selected="false">Mês</button>
      </div>
      <p class="legenda" id="legenda" aria-label="Origem dos itens"></p>
    </div>

    <details class="novo" id="novo">
      <summary>Novo compromisso</summary>
      <form id="novo-form" class="formulario" autocomplete="off">
        <div class="par">
          <div class="campo"><label for="a-titulo">Título</label><input id="a-titulo" class="controle" type="text" maxlength="120" required></div>
          <div class="campo"><label for="a-tipo">Tipo</label><select id="a-tipo" class="controle"><option value="">sem tipo</option></select></div>
        </div>
        <div class="par">
          <div class="campo"><label for="a-data">Data</label><input id="a-data" class="controle" type="date" required></div>
          <div class="campo"><label for="a-obs">Observação (opcional)</label><input id="a-obs" class="controle" type="text" maxlength="200"></div>
        </div>
        <div class="par">
          <div class="campo"><label for="a-inicio">Início (vazio = dia inteiro)</label><input id="a-inicio" class="controle" type="time"></div>
          <div class="campo"><label for="a-fim">Fim</label><input id="a-fim" class="controle" type="time"></div>
        </div>
        <button type="submit" class="botao">Pôr na agenda</button>
        <p class="dica" id="novo-msg" role="status"></p>
      </form>
    </details>

    <section id="visao-lista" role="tabpanel" aria-labelledby="aba-lista">
      <div class="dias" id="dias"></div>
    </section>

    <section class="destaque" id="visao-mes" role="tabpanel" aria-labelledby="aba-mes" hidden>
      <div class="mes-cab">
        <button type="button" class="botao so-icone" id="mes-anterior" aria-label="Mês anterior"></button>
        <h2 id="mes-titulo" aria-live="polite">Mês</h2>
        <button type="button" class="botao so-icone" id="mes-proximo" aria-label="Próximo mês"></button>
      </div>
      <div class="mes" id="mes-grade"></div>
      <div class="dia-escolhido" id="dia-escolhido"></div>
    </section>

    <p class="nota">Compromissos novos entram aqui (editar e apagar, no Obsidian). Vêm de <code>10-diario/agenda.md</code> (skill <code>semana</code> ou Obsidian); prazos, dos cards abertos do kanban; o resto, das datas das outras áreas.</p>
  </main>

  <script src="/static/shell.js"></script>
  <script src="/static/live.js"></script>
  <script src="/static/escrita.js"></script>
  <script src="/agenda/app.js"></script>
</body>
</html>
